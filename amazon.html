<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>

    <div style="width:100vw; height:100vh; border:5px solid black;">

        <!-- Top Navbar -->

        <div style="width:100%; height:20vh; background-color:rgb(215,217,218);">

            <div style="border:4px solid salmon; height:70%;">

                <div style="display:flex; justify-content:space-between; padding:20px;">

                    <h3>Amazon</h3>

                    <p>Vadodara</p>

                    <div>
                        <input type="text" placeholder="Search items">
                        <button>Search</button>
                    </div>

                    <p>Account</p>

                    <p>Cart</p>

                </div>

            </div>

            <div style="border:4px solid green; height:30%;">

                <div style="display:flex; justify-content:space-between; padding:10px;">

                    <p>Amazon Pay</p>
                    <p>Mens</p>
                    <p>Women</p>
                    <p>BestSeller</p>
                    <p>Kitchen</p>
                    <p>Electronics</p>

                </div>

            </div>

        </div>

        <!-- Yellow Section -->

        <div style="width:100%; height:80vh; background-color:yellow;">

            <!-- Center Box -->

            <div style="display:flex; justify-content:center; padding-top:60px;">

                <div style="width:40%; height:180px; border:4px solid black; background-color:yellow;">
                </div>

            </div>

            <!-- 4 Boxes -->

            <div style="display:flex; justify-content:space-around; margin-top:40px;">

                <div style="width:20%; height:200px; border:4px solid black; background-color:yellow;">
                </div>

                <div style="width:20%; height:200px; border:4px solid black; background-color:yellow;">
                </div>

                <div style="width:20%; height:200px; border:4px solid black; background-color:yellow;">
                </div>

                <div style="width:20%; height:200px; border:4px solid black; background-color:yellow;">
                </div>

            </div>

        </div>

    </div>

</body>

</html>
