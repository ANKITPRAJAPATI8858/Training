<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
     <!-- Heading -->
      <h1>Student Registration Form</h1>

      <!-- student information -->
       <form>
        <!-- personal information -->
         <fieldset>
            <legend>
                personal information
            </legend>
            <label>
                Name:
                <input type="text" placeholder="john Deo">
            </label>
            <br>
            <label for ="email">
                Email:
                <input type="email" id ="email" placeholder="abc@expample.com">
            </label>
            <br>
            <label for ="Mobile">
                Mobile:
                <input type="mob" id="mobile" placeholder="+91 1234567890">
            </label>
            <br>
            <label for = "dob"></label>
                Date of Birth:
                <input type = "date" id = "dob">
            </label>
            <br>
            <label for="Address">
                Address:
                <input type ="add" id ="Address" placeholder="vadodara">
            </label>
         </fieldset>
         <br>
         <fieldset>
            <!-- Gender information -->
             <legend>Gender information</legend>
             <label for="gender">
                <input type="radio" id="male" name="gender" value="male">
                Male
             </label>
              <label for="gender">
                
                <input type="radio" id="female" name="gender" value="female">
                Female
              </label>
         </fieldset>
         <br>
         <fieldset>
                <!-- course information -->
                <legend>Course information</legend>
                <label for="course">
                    Course:
                    <select id="course">
                        <option disabled selected>Select Course</option>
                        <option value="bca">BCA</option>        
                        <option value="bsc">BSC</option>
                        <option value="bcom">BCOM</option>
                    </select>
                </label>
         </fieldset>
         <!-- custom data attribute-- use for texting purpose -->
            <br>
            data-ns-text
        <!-- object-->
         l

       </form>
</body>
</html>
